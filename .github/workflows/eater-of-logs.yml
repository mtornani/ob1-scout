name: Eater of Logs

on:
  schedule:
    - cron: '0 8 * * 1,4'  # Lunedì e Giovedì alle 8:00 UTC
  workflow_dispatch:      # Permette l'avvio manuale per testing

jobs:
  digest-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r eater-of-logs/requirements.txt

      - name: Run Eater of Logs Proposal
        run: python eater-of-logs/eater.py
        env:
          ANOMALIES_FILE: "eater-of-logs/data.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OFFICE_CHAT_ID: ${{ secrets.TELEGRAM_OFFICE_CHAT_ID }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_PUBLIC_LINK: "https://t.me/ob1scoutlegapro"
          # Altri segreti (X, Bluesky) saranno usati dal Worker o in step successivi
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
