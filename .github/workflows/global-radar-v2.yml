name: OB1 Scout v2 - Radar

# Pipeline v2 in produzione: source-first, gate a 2 fonti, corroborazione
# attiva. Sostituisce la v1 (pensionata: global-radar.yml resta solo manuale).
on:
  schedule:
    - cron: '30 */6 * * *'   # ogni 6 ore (offset :30 per evitare i picchi GH)
  workflow_dispatch:
    inputs:
      llm_budget:
        description: "Max chiamate LLM per run"
        required: false
        default: "15"

concurrency:
  group: radar-v2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        # v7 (non v5): tolti gli avvisi "Node 20 is being deprecated..." che
        # comparivano in OGNI log di stanotte — v5 gira ancora su Node 20,
        # forzato su Node 24 dal runner. Verificato sulla pagina release vera
        # (github.com/actions/checkout e /setup-python), non a memoria.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed v2 DB (solo primo run — migra i 67 giocatori v1)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ ! -f data/ob1_v2.db ]; then
            echo "Primo run: seed dalla produzione v1"
            python scripts/migrate_to_v2.py
          else
            echo "DB v2 presente, nessun seed"
          fi

      - name: Run v2 ingest (source-first + corroborazione)
        env:
          # Zero-cost per costruzione: free_only significa che Gemini non viene
          # MAI chiamato, quindi nessun percorso può generare una fattura —
          # indipendentemente da quali chiavi finiscono nei secret. Verificato
          # sul run del 3 ago 2026: la catena free copre già il lavoro
          # (via_fallback 6 su 7 chiamate). Per riabilitare Gemini come rete di
          # sicurezza serve un cambio esplicito qui: free_first.
          OB1_LLM_MODE: free_only
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # SambaNova: TOLTO da FREE_PROVIDER_SPECS il 28 ago 2026, stessa
          # sorte di Cerebras qui sopra. Aggiunto il 27 ago come alternativa
          # proprio a Cerebras; collegata la chiave vera, il run #191 ha dato
          # HTTP 402 PAYMENT_METHOD_REQUIRED — il free tier dichiarato (200k
          # token/giorno) esiste solo dopo aver registrato una carta. Questa
          # riga non ha più effetto (il codice non contatta più questo
          # provider): lasciata per lo stesso motivo di CEREBRAS_API_KEY sopra,
          # se il secret viene rimosso da GitHub la riga passa stringa vuota
          # senza errore.
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Jina Search (20 ago 2026), fonte di ricerca primaria — vedi
          # src/scraper_global.py. Se il secret manca, il codice ripiega su
          # ddgs senza errore (stesso pattern "chiave assente = niente
          # provider" degli altri, non un fallimento).
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INGEST_LLM_BUDGET: ${{ github.event.inputs.llm_budget || '15' }}
          # 25s, non 12: il modello Groq free cambiato il 19 ago 2026
          # (openai/gpt-oss-120b, rimpiazzo di llama-3.3-70b-versatile
          # deprecato) ha un tetto free di 8k TPM invece dei ~12k del
          # precedente — vedi scripts/ingest_v2.py per la misura reale.
          INGEST_CALL_DELAY: "25"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/ingest_v2.py

      - name: Export dashboard v2
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/export_dashboard_v2.py

      - name: Commit e push dati
        run: |
          git config --global user.name "OB1 Scout Bot"
          git config --global user.email "bot@ob1-radar.com"
          git add -f data/ob1_v2.db docs/data/players_v2.json
          git commit -m "Radar v2: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "Nessun cambiamento"
          # Riallinea con lo STESSO ramo che ha lanciato il run, non "main"
          # a fisso. Sul cron ordinario il comportamento non cambia di una
          # virgola — schedule gira solo su main, quindi $GITHUB_REF_NAME
          # vale "main" e questa riga fa esattamente quello che faceva.
          # Ma un dispatch manuale su un branch (31 ago 2026, per validare
          # il grafo delle fonti prima del merge) provava a riallinearsi con
          # "main" pur girando su un altro ramo: su un checkout shallow, e
          # con main nel frattempo avanzato di roba non correlata, git legge
          # OGNI file come aggiunto da entrambe le parti — CONFLICT (add/add)
          # ovunque, run fallita all'ultimo passo, 13 minuti di ingest vero
          # spesi e persi col runner perché il push non è mai stato raggiunto.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
