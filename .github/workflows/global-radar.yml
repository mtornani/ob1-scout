name: OB1 Global Radar - Automated Scan

on:
  schedule:
    # Runs every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp google-generativeai python-dotenv requests

      - name: Run Global Radar Pipeline
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_pipeline.py

      - name: Generate Dashboard JSON
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/generate_dashboard_data.py

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "OB1 Radar Bot"
          git config --global user.email "bot@ob1-radar.com"
          git add -f data/ob1_global.db docs/data/anomalies.json
          git commit -m "Update Radar Memex: $(date)" || echo "No changes to commit"
          git push
