# OB1 Observer — manual only.
# No schedule, no commits to main. Radar v2 is the production pipeline.

name: OB1 Observer - Symbiont M2

on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (solo notifier)
        run: pip install requests

      - name: Run Observer (observe + heartbeat, no git write)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OFFICE_CHAT_ID: ${{ secrets.TELEGRAM_OFFICE_CHAT_ID }}
        run: python observer/observer_monitor.py
